# Gates of this product (seeded by the UXSYSTEMS software factory when the product was created).
# They run on every branch push (not on tag pushes: the factory's signed releases create `android-*` tags), on the
# factory's runner factory-core-1. The factory waits for them after each build: a task
# is done only with green gates, and the owner's `merge` is refused while they are red. A skipped job counts as green.
#
# CI image (factory decision D24): every job except `tested` runs in 127.0.0.1:3000/catexam/catexam-ci:main
# (ci/Dockerfile: JDK 21, Android SDK, Gradle, wine, warm npm/Electron/Gradle caches), so a run downloads almost
# nothing. The factory's publisher builds it from ci/Dockerfile on `main` whenever the hash of
# `ci/Dockerfile .dockerignore package-lock.json android/gradle/wrapper/gradle-wrapper.properties` changes and
# pushes it as `:<hash>` and `:main`. The runner pulls it with its own read-only login: no workflow pushes an image
# or uses a registry secret.
# A change to the image's inputs is tested on its branch with the CURRENT `:main` image; the new image is published
# a few minutes after the merge, plus build time. So make CI-image changes their own task and merge them first.
#
# Gate-run rules (factory decision D26):
# - A newer push to the same branch cancels the older run (concurrency).
# - `tested` runs first. On `main`, when the merge commit holds exactly the tree the pull request's gates passed,
#   lint, test, smoke and windows-installer are skipped (again=false); android-apk still runs, because the factory
#   signer signs the APK of the newest successful `main` run.
# - Path filters: `tested` lists the files this branch changed (against main; on `main` against the previous
#   commit) and the heavy jobs run only when a path that can affect them changed. On `main`, android-apk runs
#   whenever the APK can differ from the previous `main`; otherwise the signer keeps the last signed APK.
# Order: tested, then lint and test, then smoke, then windows-installer and android-apk (the heavy builds never run
# alongside the smoke test).
#
# PLACEHOLDERS: each job runs the product's own command when the repository has one, and otherwise PASSES WITHOUT
# CHECKING ANYTHING (it says so in its log). Replace them with the product's real checks as the product grows.
name: gates
on:
  push:
    branches: ['**']

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tested:
    # Decides what this run has to check (D26). Runs in the runner's default (plain node) image.
    runs-on: linux
    outputs:
      again: ${{ steps.again.outputs.again }}
      smoke: ${{ steps.paths.outputs.smoke }}
      windows: ${{ steps.paths.outputs.windows }}
      android: ${{ steps.paths.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: already tested? (merge commit with the tree of the pull request's head)
        id: again
        env:
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          again=true
          if [ "$GITHUB_REF" = "$DEFAULT_REF" ] && git rev-parse -q --verify 'HEAD^2' >/dev/null \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
            again=false
          fi
          echo "again=$again" >> "$GITHUB_OUTPUT"
          echo "again=$again"
      - name: changed paths (which heavy jobs can be affected)
        id: paths
        env:
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -o pipefail
          if [ "$GITHUB_REF" = "$DEFAULT_REF" ]; then
            range='HEAD^1..HEAD'
          else
            git fetch -q --depth=200 origin +refs/heads/main:refs/remotes/origin/main "+$GITHUB_SHA" \
              || echo "cannot fetch main; the diff below falls back to running every job"
            range='origin/main...HEAD'
          fi
          smoke=false windows=false android=false
          if ! files=$(git diff --name-only "$range"); then
            echo "cannot list the changed files ($range); running every job"
            smoke=true windows=true android=true
          fi
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              .gitea/workflows/*|ci/*) smoke=true windows=true android=true; continue ;;
            esac
            case "$f" in
              *.md|docs/*) ;;
              *) smoke=true ;;
            esac
            case "$f" in
              src/*|scripts/*|questions/*|assets/*|electron-builder*|package*.json|tsconfig*.json) windows=true ;;
            esac
            case "$f" in
              android/*|src/*|scripts/*|questions/*|assets/*|capacitor.config.*|package*.json|tsconfig*.json) android=true ;;
            esac
          done <<<"$files"
          printf '%s\n' "$files"
          printf 'smoke=%s\nwindows=%s\nandroid=%s\n' "$smoke" "$windows" "$android" | tee -a "$GITHUB_OUTPUT"

  lint:
    needs: tested
    if: needs.tested.outputs.again == 'true'
    runs-on: linux
    container:
      image: 127.0.0.1:3000/catexam/catexam-ci:main
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: lint (make lint, or npm run lint)
        run: |
          if [ -f Makefile ] && grep -qE '^lint:' Makefile; then
            make lint
          elif [ -f package.json ] && grep -q '"lint"' package.json; then
            npm ci && npm run lint
          else
            echo "PLACEHOLDER: no lint command in this repository (make lint / npm run lint); passing without checks"
          fi

  test:
    needs: tested
    if: needs.tested.outputs.again == 'true'
    runs-on: linux
    container:
      image: 127.0.0.1:3000/catexam/catexam-ci:main
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: test (make check, npm test, or pytest)
        run: |
          if [ -f Makefile ] && grep -qE '^check:' Makefile; then
            make check
          elif [ -f Makefile ] && grep -qE '^test:' Makefile; then
            make test
          elif [ -f package.json ] && grep -q '"test"' package.json; then
            npm ci && npm test
          elif ls test_*.py tests/test_*.py >/dev/null 2>&1 || [ -f pytest.ini ] || grep -qs '^\[tool.pytest' pyproject.toml; then
            python3 -m pytest --version >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq python3-pytest >/dev/null; }
            python3 -m pytest -q
          else
            echo "PLACEHOLDER: no test command in this repository (make check / npm test / pytest); passing without checks"
          fi

  smoke:
    # Starts the real Electron app headless (Xvfb) and drives a full exam, a training session and a game round
    # through the screens (src/main/smoke.ts), then does the same with the Android web app (www/) in a phone-sized
    # window, checking the phone layout. Linux only: no Windows or Android hand exists for this product.
    needs: [tested, lint, test]
    if: needs.tested.outputs.again == 'true' && needs.tested.outputs.smoke == 'true'
    runs-on: linux
    container:
      image: 127.0.0.1:3000/catexam/catexam-ci:main
    steps:
      - uses: actions/checkout@v4
      - name: smoke (npm run smoke under Xvfb)
        run: |
          npm ci
          xvfb-run -a npm run smoke

  windows-installer:
    # Builds the Windows NSIS installer on Linux (electron-builder edits the .exe resources through wine) and
    # attaches it to the run as a downloadable artefact. Not run or installed here: no Windows hand exists.
    needs: [tested, smoke]
    if: needs.tested.outputs.again == 'true' && needs.tested.outputs.windows == 'true'
    runs-on: linux
    container:
      image: 127.0.0.1:3000/catexam/catexam-ci:main
    steps:
      - uses: actions/checkout@v4
      - name: build installer (npm run dist:win)
        run: |
          npm ci
          # electron-builder fetches NSIS/winCodeSign from GitHub when the image lacks them (new versions), which
          # sometimes times out here (10 min). One retry; the check below still runs.
          npm run dist:win -- --publish never || { echo "dist:win failed, retrying once"; npm run dist:win -- --publish never; }
      - name: check installer
        run: |
          ls -l release/*.exe
          for f in release/*.exe; do
            file "$f"
            file "$f" | grep -q 'PE32.*Windows' || { echo "not a Windows executable: $f"; exit 1; }
            grep -aq 'Nullsoft' "$f" || { echo "not an NSIS installer: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v3 # v4 needs Gitea's newer artifact API; it fails on this server
        with:
          name: CATExam-windows-installer
          path: release/*.exe
          if-no-files-found: error

  android-apk:
    # Builds the Android app (Capacitor, unsigned release APK) on Linux and attaches it to the run as a downloadable
    # artefact. Not signed here (no signing secrets in the repository): the factory signs it after merge. Not
    # installed or run here: no Android hand (device or emulator) exists.
    # Runs on `main` too (also when smoke was skipped because the pull request's gates passed this tree): the
    # factory signer signs the APK of the newest successful `main` run.
    needs: [tested, smoke]
    if: >-
      always() && needs.tested.result == 'success' && needs.tested.outputs.android == 'true'
      && (needs.smoke.result == 'success'
          || (needs.smoke.result == 'skipped' && needs.tested.outputs.again == 'false'))
    runs-on: linux
    container:
      image: 127.0.0.1:3000/catexam/catexam-ci:main
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: build APK (npm run dist:android)
        run: |
          npm ci
          npm run dist:android
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk release/CATExam-android-unsigned.apk
      - name: check APK
        run: |
          ls -l release/CATExam-android-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging release/CATExam-android-unsigned.apk | grep -E "^package: name='com.uxsystems.catexam'"
          # No apksigner verify: the APK is unsigned on purpose; the factory signs it after merge.
          # A file, not `unzip | grep -q`: under pipefail, grep -q quitting early makes unzip fail with SIGPIPE.
          unzip -l release/CATExam-android-unsigned.apk > /tmp/apk-files.txt
          grep -q 'assets/public/index.html' /tmp/apk-files.txt || { echo "web app missing from the APK"; exit 1; }
          grep -q 'assets/public/questions/index.json' /tmp/apk-files.txt || { echo "question banks missing from the APK"; exit 1; }
      - uses: actions/upload-artifact@v3 # v4 needs Gitea's newer artifact API; it fails on this server
        with:
          name: CATExam-android-unsigned
          path: release/CATExam-android-unsigned.apk
          if-no-files-found: error

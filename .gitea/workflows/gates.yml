# Gates of this product (seeded by the UXSYSTEMS software factory when the product was created).
# They run on every push, on the factory's runner factory-core-1, each job in a container (runner label `linux` =
# node:22-bookworm). The factory waits for them after each build: a task is done only with green gates, and the
# owner's `merge` is refused while they are red.
#
# PLACEHOLDERS: each job runs the product's own command when the repository has one, and otherwise PASSES WITHOUT
# CHECKING ANYTHING (it says so in its log). Replace them with the product's real checks as the product grows.
name: gates
on: [push]

jobs:
  lint:
    runs-on: linux
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: lint (make lint, or npm run lint)
        run: |
          if [ -f Makefile ] && grep -qE '^lint:' Makefile; then
            make lint
          elif [ -f package.json ] && grep -q '"lint"' package.json; then
            npm ci && npm run lint
          else
            echo "PLACEHOLDER: no lint command in this repository (make lint / npm run lint); passing without checks"
          fi

  test:
    runs-on: linux
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: test (make check, npm test, or pytest)
        run: |
          if [ -f Makefile ] && grep -qE '^check:' Makefile; then
            make check
          elif [ -f Makefile ] && grep -qE '^test:' Makefile; then
            make test
          elif [ -f package.json ] && grep -q '"test"' package.json; then
            npm ci && npm test
          elif ls test_*.py tests/test_*.py >/dev/null 2>&1 || [ -f pytest.ini ] || grep -qs '^\[tool.pytest' pyproject.toml; then
            python3 -m pytest --version >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq python3-pytest >/dev/null; }
            python3 -m pytest -q
          else
            echo "PLACEHOLDER: no test command in this repository (make check / npm test / pytest); passing without checks"
          fi

  smoke:
    # Starts the real Electron app headless (Xvfb) and drives a full exam, a training session and a game round
    # through the screens (src/main/smoke.ts), then does the same with the Android web app (www/) in a phone-sized
    # window, checking the phone layout. Linux only: no Windows or Android hand exists for this product.
    runs-on: linux
    steps:
      - uses: actions/checkout@v4
      - name: cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: smoke (npm run smoke under Xvfb)
        run: |
          apt-get update -qq
          apt-get install -y -qq xvfb xauth libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgtk-3-0 \
            libgbm1 libasound2 libxss1 libxshmfence1 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 >/dev/null
          npm ci
          xvfb-run -a npm run smoke

  windows-installer:
    # Builds the Windows NSIS installer on Linux (electron-builder edits the .exe resources through wine) and
    # attaches it to the run as a downloadable artefact. Not run or installed here: no Windows hand exists.
    runs-on: linux
    steps:
      - uses: actions/checkout@v4
      - name: cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-win-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-win-
      - name: install wine (32-bit too; electron-builder runs the 32-bit NSIS uninstaller stub under wine)
        run: |
          dpkg --add-architecture i386
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends wine wine32 wine64 file >/dev/null
          wine --version
      - name: build installer (npm run dist:win)
        env:
          WINEDEBUG: "-all"
        run: |
          npm ci
          # electron-builder fetches NSIS/winCodeSign from GitHub, which sometimes times out here (10 min). One retry;
          # what was downloaded stays in ~/.cache/electron-builder (cached across runs), and the check below still runs.
          npm run dist:win -- --publish never || { echo "dist:win failed, retrying once"; npm run dist:win -- --publish never; }
      - name: check installer
        run: |
          ls -l release/*.exe
          for f in release/*.exe; do
            file "$f"
            file "$f" | grep -q 'PE32.*Windows' || { echo "not a Windows executable: $f"; exit 1; }
            grep -aq 'Nullsoft' "$f" || { echo "not an NSIS installer: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v3 # v4 needs Gitea's newer artifact API; it fails on this server
        with:
          name: CATExam-windows-installer
          path: release/*.exe
          if-no-files-found: error

  android-apk:
    # Builds the Android app (Capacitor, debug-signed APK) on Linux and attaches it to the run as a downloadable
    # artefact. Not installed or run here: no Android hand (device or emulator) exists.
    runs-on: linux
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: install JDK 21 and the Android SDK (platform 36, build tools 36.0.0)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends unzip >/dev/null
          mkdir -p /opt/jdk /opt/android-sdk/cmdline-tools
          # Downloads to a file with retries: a connection reset mid-stream used to break a piped `curl | tar`.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/jdk.tar.gz "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse"
          tar xzf /tmp/jdk.tar.gz -C /opt/jdk --strip-components=1
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          export JAVA_HOME=/opt/jdk
          # The runner uses `set -o pipefail`: `yes | …` fails with SIGPIPE (141) once sdkmanager stops reading.
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses < <(yes) >/dev/null
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "JAVA_HOME=/opt/jdk" >> "$GITHUB_ENV"
          # apksigner (check APK) runs `java` from PATH, not from JAVA_HOME.
          echo "/opt/jdk/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
      - name: build APK (npm run dist:android)
        run: |
          npm ci
          npm run dist:android
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/CATExam-android.apk
      - name: check APK
        run: |
          ls -l release/CATExam-android.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging release/CATExam-android.apk | grep -E "^package: name='com.uxsystems.catexam'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify release/CATExam-android.apk
          # A file, not `unzip | grep -q`: under pipefail, grep -q quitting early makes unzip fail with SIGPIPE.
          unzip -l release/CATExam-android.apk > /tmp/apk-files.txt
          grep -q 'assets/public/index.html' /tmp/apk-files.txt || { echo "web app missing from the APK"; exit 1; }
          grep -q 'assets/public/questions/index.json' /tmp/apk-files.txt || { echo "question banks missing from the APK"; exit 1; }
      - uses: actions/upload-artifact@v3 # v4 needs Gitea's newer artifact API; it fails on this server
        with:
          name: CATExam-android-apk
          path: release/CATExam-android.apk
          if-no-files-found: error

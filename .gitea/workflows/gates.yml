# Gates of this product (seeded by the UXSYSTEMS software factory when the product was created).
# They run on every push, on the factory's runner factory-core-1. The factory waits for them after each build: a task
# is done only with green gates, and the owner's `merge` is refused while they are red.
#
# Every job runs in the CI build image (ci/Dockerfile: JDK 21, Android SDK, Gradle, wine, warm npm/Electron/Gradle
# caches), so a run downloads almost nothing. The `image` job builds it (kaniko: job containers have no Docker) and
# pushes it to the Gitea container registry only when ci/Dockerfile, package-lock.json or the Gradle wrapper changed.
# Order: image, then lint and test, then smoke, then windows-installer and android-apk (the heavy builds never run
# alongside the smoke test).
# Registry access: the repository secrets REGISTRY_USER and REGISTRY_TOKEN (a Gitea access token of that user with
# read and write on packages). The job's own token cannot be used: Gitea 28 gives it no package scope, so the
# registry's /v2/token answers UNAUTHORIZED. The jobs reach Gitea as gitea:3000; the VM's Docker pulls from 127.0.0.1:3000.
#
# PLACEHOLDERS: each job runs the product's own command when the repository has one, and otherwise PASSES WITHOUT
# CHECKING ANYTHING (it says so in its log). Replace them with the product's real checks as the product grows.
name: gates
on: [push]

jobs:
  image:
    runs-on: linux
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    env:
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: image tag (hash of what the image is built from)
        id: tag
        run: |
          tag=$(cat ci/Dockerfile .dockerignore package-lock.json android/gradle/wrapper/gradle-wrapper.properties | sha256sum | cut -c1-16)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=127.0.0.1:3000/catexam/catexam-ci:$tag" >> "$GITHUB_OUTPUT"
          echo "CI image catexam/catexam-ci:$tag"
      - name: build and push the image unless the registry has it
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DOCKER_CONFIG: /kaniko/.docker
          SSL_CERT_DIR: /kaniko/ssl/certs
        run: |
          [ -n "$REGISTRY_USER" ] && [ -n "$REGISTRY_TOKEN" ] || { echo "set the repository secrets REGISTRY_USER and REGISTRY_TOKEN (Gitea access token with read and write on packages)"; exit 1; }
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.3/go-containerregistry_Linux_x86_64.tar.gz | tar xz -C /usr/local/bin crane
          crane export gcr.io/kaniko-project/executor:v1.23.2 - | tar -x -C / kaniko
          printf '{"auths":{"gitea:3000":{"auth":"%s"}}}' "$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_TOKEN" | base64 -w0)" > /kaniko/.docker/config.json
          dest="gitea:3000/catexam/catexam-ci:$TAG"
          if out=$(crane manifest --insecure "$dest" 2>&1); then
            echo "$dest is already in the registry; nothing to build"
            exit 0
          elif ! grep -qE 'MANIFEST_UNKNOWN|NAME_UNKNOWN|404' <<<"$out"; then
            echo "cannot read the registry (REGISTRY_USER/REGISTRY_TOKEN need read and write on packages): $out"
            exit 1
          fi
          # kaniko builds in this (throwaway) container's own filesystem; nothing runs in it afterwards.
          /kaniko/executor --force --context "dir://$PWD" --dockerfile ci/Dockerfile --destination "$dest" \
            --insecure --snapshot-mode=redo

  lint:
    needs: image
    runs-on: linux
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: lint (make lint, or npm run lint)
        run: |
          if [ -f Makefile ] && grep -qE '^lint:' Makefile; then
            make lint
          elif [ -f package.json ] && grep -q '"lint"' package.json; then
            npm ci && npm run lint
          else
            echo "PLACEHOLDER: no lint command in this repository (make lint / npm run lint); passing without checks"
          fi

  test:
    needs: image
    runs-on: linux
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: test (make check, npm test, or pytest)
        run: |
          if [ -f Makefile ] && grep -qE '^check:' Makefile; then
            make check
          elif [ -f Makefile ] && grep -qE '^test:' Makefile; then
            make test
          elif [ -f package.json ] && grep -q '"test"' package.json; then
            npm ci && npm test
          elif ls test_*.py tests/test_*.py >/dev/null 2>&1 || [ -f pytest.ini ] || grep -qs '^\[tool.pytest' pyproject.toml; then
            python3 -m pytest --version >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq python3-pytest >/dev/null; }
            python3 -m pytest -q
          else
            echo "PLACEHOLDER: no test command in this repository (make check / npm test / pytest); passing without checks"
          fi

  smoke:
    # Starts the real Electron app headless (Xvfb) and drives a full exam, a training session and a game round
    # through the screens (src/main/smoke.ts), then does the same with the Android web app (www/) in a phone-sized
    # window, checking the phone layout. Linux only: no Windows or Android hand exists for this product.
    needs: [image, lint, test]
    runs-on: linux
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: smoke (npm run smoke under Xvfb)
        run: |
          npm ci
          xvfb-run -a npm run smoke

  windows-installer:
    # Builds the Windows NSIS installer on Linux (electron-builder edits the .exe resources through wine) and
    # attaches it to the run as a downloadable artefact. Not run or installed here: no Windows hand exists.
    needs: [image, smoke]
    runs-on: linux
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: build installer (npm run dist:win)
        run: |
          npm ci
          # electron-builder fetches NSIS/winCodeSign from GitHub when the image lacks them (new versions), which
          # sometimes times out here (10 min). One retry; the check below still runs.
          npm run dist:win -- --publish never || { echo "dist:win failed, retrying once"; npm run dist:win -- --publish never; }
      - name: check installer
        run: |
          ls -l release/*.exe
          for f in release/*.exe; do
            file "$f"
            file "$f" | grep -q 'PE32.*Windows' || { echo "not a Windows executable: $f"; exit 1; }
            grep -aq 'Nullsoft' "$f" || { echo "not an NSIS installer: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v3 # v4 needs Gitea's newer artifact API; it fails on this server
        with:
          name: CATExam-windows-installer
          path: release/*.exe
          if-no-files-found: error

  android-apk:
    # Builds the Android app (Capacitor, debug-signed APK) on Linux and attaches it to the run as a downloadable
    # artefact. Not installed or run here: no Android hand (device or emulator) exists.
    needs: [image, smoke]
    runs-on: linux
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: build APK (npm run dist:android)
        run: |
          npm ci
          npm run dist:android
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/CATExam-android.apk
      - name: check APK
        run: |
          ls -l release/CATExam-android.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging release/CATExam-android.apk | grep -E "^package: name='com.uxsystems.catexam'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify release/CATExam-android.apk
          # A file, not `unzip | grep -q`: under pipefail, grep -q quitting early makes unzip fail with SIGPIPE.
          unzip -l release/CATExam-android.apk > /tmp/apk-files.txt
          grep -q 'assets/public/index.html' /tmp/apk-files.txt || { echo "web app missing from the APK"; exit 1; }
          grep -q 'assets/public/questions/index.json' /tmp/apk-files.txt || { echo "question banks missing from the APK"; exit 1; }
      - uses: actions/upload-artifact@v3 # v4 needs Gitea's newer artifact API; it fails on this server
        with:
          name: CATExam-android-apk
          path: release/CATExam-android.apk
          if-no-files-found: error
